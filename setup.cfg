[metadata]
name = bunnytrail-cli
version = 0.1.0
description = Authoring CLI for bunnytrail sites
url = https://github.com/simoneleemburg/bunnytrail-cli

[options]
packages = bunnytrail_cli
python_requires = >=3.9
install_requires =
    click>=8.0
    prompt_toolkit>=3.0
    pyyaml>=6.0

[options.entry_points]
console_scripts =
    bt = bunnytrail_cli.main:cli
